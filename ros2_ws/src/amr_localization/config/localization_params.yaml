amcl:
  ros__parameters:
    use_sim_time: true

    base_frame_id: base_link
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: /scan

    tf_broadcast: true
    transform_tolerance: 0.5

    set_initial_pose: false
    always_reset_initial_pose: false

    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0

    min_particles: 500
    max_particles: 2000

    update_min_d: 0.05
    update_min_a: 0.05

    laser_model_type: likelihood_field
    laser_max_range: 12.0
    max_beams: 60


map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ""